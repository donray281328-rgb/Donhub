<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trading Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    /* HEADER */
    header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: #ff444f;
    }

    .balance {
      background: #f1f3f5;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* LAYOUT */
    .container {
      display: grid;
      grid-template-columns: 230px 1fr 300px;
      min-height: calc(100vh - 64px);
    }

    /* SIDEBAR */
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e5e5e5;
      padding: 20px 12px;
    }

    .sidebar h3 {
      font-size: 13px;
      color: #777;
      margin: 10px 12px;
      text-transform: uppercase;
    }

    .market {
      padding: 12px;
      border-radius: 7px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .market:hover,
    .market.active {
      background: #fcebed;
      color: #d92f3d;
    }

    /* MAIN */
    main {
      padding: 20px;
      min-width: 0;
    }

    .market-header {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .market-name {
      font-size: 20px;
      font-weight: bold;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
    }

    .up {
      color: #18a558;
    }

    .down {
      color: #e23b4a;
    }

    /* CHART */
    .chart-box {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 15px;
      height: 450px;
    }

    .chart-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .chart-toolbar button {
      border: 1px solid #ddd;
      background: white;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .chart-toolbar button:hover {
      background: #f1f1f1;
    }

    canvas {
      width: 100%;
      height: 380px;
    }

    /* TRADE PANEL */
    .trade-panel {
      background: white;
      border-left: 1px solid #e5e5e5;
      padding: 20px;
    }

    .trade-panel h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #666;
      margin: 15px 0 6px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #ff444f;
    }

    .trade-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .trade-buttons button {
      border: none;
      padding: 14px;
      border-radius: 7px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #18a558;
    }

    .sell {
      background: #e23b4a;
    }

    .buy:hover,
    .sell:hover {
      opacity: 0.9;
    }

    /* HISTORY */
    .history {
      background: white;
      margin-top: 15px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 15px;
    }

    .history h3 {
      margin-bottom: 12px;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 1000px) {
      .container {
        grid-template-columns: 190px 1fr;
      }

      .trade-panel {
        display: none;
      }
    }

    @media (max-width: 700px) {
      header {
        padding: 0 15px;
      }

      .container {
        display: block;
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid #ddd;
        overflow-x: auto;
        white-space: nowrap;
      }

      .sidebar h3 {
        display: none;
      }

      .market {
        display: inline-block;
        margin-right: 5px;
      }

      main {
        padding: 12px;
      }

      .chart-box {
        height: 350px;
      }

      canvas {
        height: 280px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <span>●</span> Trading
  </div>

  <div class="balance">
    Balance: $10,000.00
  </div>
</header>


<div class="container">

  <!-- MARKETS -->
  <aside class="sidebar">

    <h3>Markets</h3>

    <div class="market active" onclick="selectMarket('Volatility 75 Index')">
      Volatility 75 Index
    </div>

    <div class="market" onclick="selectMarket('Volatility 50 Index')">
      Volatility 50 Index
    </div>

    <div class="market" onclick="selectMarket('Boom 1000 Index')">
      Boom 1000 Index
    </div>

    <div class="market" onclick="selectMarket('Crash 1000 Index')">
      Crash 1000 Index
    </div>

    <div class="market" onclick="selectMarket('Step Index')">
      Step Index
    </div>

    <div class="market" onclick="selectMarket('EUR/USD')">
      EUR/USD
    </div>

    <div class="market" onclick="selectMarket('BTC/USD')">
      BTC/USD
    </div>

    <div class="market" onclick="selectMarket('Gold')">
      Gold
    </div>

  </aside>


  <!-- MAIN CONTENT -->
  <main>

    <div class="market-header">

      <div>
        <div class="market-name" id="marketName">
          Volatility 75 Index
        </div>

        <small>Market price</small>
      </div>

      <div class="price up" id="price">
        125.430
      </div>

    </div>


    <!-- CHART -->
    <div class="chart-box">

      <div class="chart-toolbar">
        <button onclick="setTimeframe('1m')">1m</button>
        <button onclick="setTimeframe('5m')">5m</button>
        <button onclick="setTimeframe('15m')">15m</button>
        <button onclick="setTimeframe('1h')">1h</button>
      </div>

      <canvas id="chart"></canvas>

    </div>


    <!-- HISTORY -->
    <div class="history">

      <h3>Recent Trades</h3>

      <div class="history-row">
        <span>Volatility 75</span>
        <span class="up">BUY</span>
        <span>$25.00</span>
      </div>

      <div class="history-row">
        <span>EUR/USD</span>
        <span class="down">SELL</span>
        <span>$15.00</span>
      </div>

    </div>

  </main>


  <!-- TRADE PANEL -->
  <aside class="trade-panel">

    <h2>Trade</h2>

    <label>Market</label>

    <select id="marketSelect">
      <option>Volatility 75 Index</option>
      <option>Volatility 50 Index</option>
      <option>Boom 1000 Index</option>
      <option>Crash 1000 Index</option>
      <option>Step Index</option>
      <option>EUR/USD</option>
      <option>BTC/USD</option>
      <option>Gold</option>
    </select>


    <label>Contract Type</label>

    <select>
      <option>Rise / Fall</option>
      <option>Higher / Lower</option>
      <option>Touch / No Touch</option>
      <option>Multipliers</option>
    </select>


    <label>Stake</label>

    <input
      type="number"
      id="stake"
      value="10"
      min="1"
    >


    <label>Duration</label>

    <select>
      <option>1 minute</option>
      <option>5 minutes</option>
      <option>15 minutes</option>
      <option>30 minutes</option>
      <option>1 hour</option>
    </select>


    <div class="trade-buttons">

      <button class="buy" onclick="trade('BUY')">
        BUY
      </button>

      <button class="sell" onclick="trade('SELL')">
        SELL
      </button>

    </div>

  </aside>

</div>


<script>

  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");

  let currentPrice = 125.430;

  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    drawChart();
  }

  function drawChart() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const width = canvas.width;
    const height = canvas.height;

    /* Grid */
    ctx.strokeStyle = "#eeeeee";
    ctx.lineWidth = 1;

    for (let y = 0; y < height; y += 50) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    /* Price line */
    ctx.beginPath();

    let x = 0;
    let y = height / 2;

    ctx.moveTo(x, y);

    for (let i = 0; i < 80; i++) {

      x = (i / 79) * width;

      y =
        height / 2 +
        Math.sin(i * 0.35) * 45 +
        Math.sin(i * 0.12) * 25;

      ctx.lineTo(x, y);
    }

    ctx.strokeStyle = "#e23b4a";
    ctx.lineWidth = 2;
    ctx.stroke();
  }


  function selectMarket(name) {

    document.getElementById("marketName").textContent = name;

    document.getElementById("marketSelect").value = name;

    currentPrice = 100 + Math.random() * 100;

    updatePrice();
  }


  function updatePrice() {

    currentPrice += (Math.random() - 0.5) * 0.5;

    document.getElementById("price").textContent =
      currentPrice.toFixed(3);
  }


  function setTimeframe(timeframe) {

    console.log("Timeframe:", timeframe);

    drawChart();
  }


  function trade(type) {

    const stake =
      Number(document.getElementById("stake").value);

    if (!stake || stake <= 0) {
      alert("Please enter a valid stake.");
      return;
    }

    alert(
      type +
      " order created in DEMO mode.\n\n" +
      "Stake: $" +
      stake.toFixed(2)
    );
  }


  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();

  setInterval(updatePrice, 1000);

</script>

</body>
      </html>
